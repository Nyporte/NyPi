[package]
name = "nypi-cli"
description = "NyPi command-line agent: interactive (line and full-screen), print, JSON, RPC, and Telegram front ends"
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nypi"
path = "src/main.rs"

[dependencies]
nypi-ai.workspace = true
nypi-agent.workspace = true
nypi-core.workspace = true
nypi-vault.workspace = true
nypi-eval.workspace = true
nypi-hub.workspace = true
nypi-node.workspace = true
nypi-hub-proto.workspace = true
nypi-board-proto.workspace = true
anyhow.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
crossterm.workspace = true
dirs.workspace = true
flate2.workspace = true
futures.workspace = true
base64.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
ratatui.workspace = true
reqwest.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
tokio.workspace = true
tokio-util.workspace = true
unicode-width.workspace = true
uuid.workspace = true

[features]
default = ["local-embeddings"]
